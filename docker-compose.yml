# One service for everything: tests, data tools, the Claude tracer and the Gradio app.
# Usage: docker compose run --rm app pytest
services:
  app:
    build: .
    image: battlemap-walls:latest
    working_dir: /app
    volumes:
      # Maps and run outputs live on the host so they persist and can be showcased.
      # Note: data/ also holds data-tool code, so the host copy of that code is what runs.
      - ./data:/app/data
      - ./runs:/app/runs
      # Results figures (python -m eval.figures) are written to docs/figures/ on the host.
      - ./docs:/app/docs
      # Code and tests from the host, so editing them needs no rebuild (only new dependencies do).
      - ./tests:/app/tests
      - ./eval:/app/eval
      - ./postprocess:/app/postprocess
      - ./app:/app/app
      - ./llm:/app/llm
    # ANTHROPIC_API_KEY for the Claude wall tracer (llm/); .env is gitignored.
    env_file:
      - path: .env
        required: false
    ports:
      # Gradio's port for the app: docker compose run --rm --service-ports app python -m app.main
      - "7860:7860"
