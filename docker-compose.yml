# One service for everything: tests, data tools, training and (later) the Gradio app.
# Usage: docker compose run --rm app pytest
services:
  app:
    build: .
    image: battlemap-walls:latest
    working_dir: /app
    volumes:
      # Datasets, checkpoints and run logs live on the host so they persist and can be showcased.
      # Note: data/ also holds data-tool code, so the host copy of that code is what runs.
      - ./data:/app/data
      - ./runs:/app/runs
      # Code and tests from the host, so editing them needs no rebuild (only new dependencies do).
      - ./tests:/app/tests
      - ./eval:/app/eval
      - ./train:/app/train
      - ./postprocess:/app/postprocess
      - ./app:/app/app
    environment:
      # Physical cores on the i7-1365U (6 cores, 12 threads).
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      # Pretrained encoder weights download once into runs/cache, so later runs work offline.
      TORCH_HOME: /app/runs/cache/torch
      HF_HOME: /app/runs/cache/huggingface
      # The image has no git (training logs the commit on Colab); keep MLflow from warning.
      GIT_PYTHON_REFRESH: quiet
    ports:
      # Gradio's default port, for the app in a later week.
      - "7860:7860"
