# Settings for the Claude wall tracer (llm/agent.py) and the app (app/). Model names, effort,
# limits and prices live here, never in code. Validated by app/config.py.

# Two profiles, one per pass. `expected_*` are shown on the app's buttons: update them after
# each full reference evaluation (docs/results.md). `deadline_s` stops a pass that runs long.
# If a safety classifier declines a request, `fallbacks` lets the API re-run it on a fallback
# model (not offered for Haiku); the run log records which model answered.
# Other models for comparisons: claude-haiku-5-5, claude-fable-5-2 (llm.run --model).

[profiles.quick]             # "Suggest walls"
name = "claude-sonnet-5-5"
label = "Sonnet 5.5"
effort = "medium"            # low | medium | high | xhigh | max: thinking depth and token spend
max_tokens = 16000           # per response; one answer for a cave map is about 4,000 tokens
fallbacks = true
deadline_s = 60
expected_seconds = 25        # measured 13.11 with the Opus size step (docs/results.md)
expected_cost_usd = 0.10

[profiles.deep]              # "Deeper examination"
name = "claude-opus-5-5"
label = "Opus 5.5"
effort = "medium"
max_tokens = 16000
fallbacks = true
deadline_s = 180
expected_seconds = 70        # measured 13.11 with the size step (docs/results.md)
expected_cost_usd = 0.32

# The map-size step runs on this profile's model in both passes: on 13.11 Opus found the size
# on 3 of 3 grid maps and Sonnet on 1 of 3 (docs/results.md). Its cost is part of each pass.
[size_step]
profile = "deep"
expected_cost_usd = 0.03     # one Opus request, for llm.run --size-only
expected_seconds = 8         # one request; used only in the chunked pass's button figures

[limits]
max_turns = 24             # API calls per map
max_views = 16             # zoomed crops the model may ask for per map
max_submissions = 3        # answers the model may submit (each one is checked on an overlay)
max_cost_usd = 3.0         # stop a map when its estimated cost passes this

[views]
max_px = 1300              # longest side of any image sent to the model
max_zoom = 160             # px per square, upper bound for close-ups
jpeg_quality = 85
quadrants = true           # send the four quarters of the map up front (v2), not only the overview

# USD per million tokens, from Anthropic's price list as of 2026-11-03. Used only to estimate
# cost in the run log; the Anthropic Console has the real bill.
[prices."claude-fable-5-2"]
input = 8.0
output = 40.0
[prices."claude-opus-5-5"]
input = 4.0
output = 20.0
[prices."claude-sonnet-5-5"]
input = 2.0
output = 10.0
[prices."claude-haiku-5-5"]
input = 0.10
output = 0.50

# Light size tiers -> what the exported file says. Must equal LIGHT_TIERS in data/rasterize.py
# (tested). Roll20 derives bright and dim light from `range` on import.
[lights.small]               # candle, torch, wall sconce
range = 8.0
intensity = 1.0
[lights.medium]              # lantern, brazier, campfire, fireplace
range = 12.0
intensity = 1.0
[lights.large]               # bonfire, large fire pit, forge
range = 16.0
intensity = 1.0

# The app's input limits and export settings.
[app]
max_upload_mb = 20
min_squares = 1
max_squares = 200
default_width = 25
default_height = 25
export_ppg = 70              # Roll20's default pixels per square
export_jpeg_quality = 90
# "Detect map size from the image" starts off: detection adds about $0.03 (one Opus request)
# to a pass and missed on a map with a faint grid (docs/results.md, 13.11). The user ticks it.
detect_size_default = false

# The chunked pass (specs/002-chunked-map-tracing/): the map is split into up to 4 x 4 chunks,
# each traced by its own agent at the same time; the answers are merged by fixed rules, then an
# orchestrator model reviews the strips along the borders between chunks. The user picks the
# agents' model; the orchestrator's follows from it (constitution 2.1.0).
[chunked]
default_agents = "sonnet"
core_squares = 13          # largest side of a chunk's own area; sides are split evenly
overlap_squares = 1        # each chunk also sees and traces this far into its neighbours
max_per_side = 4           # at most 4 x 4 = 16 chunks; larger maps get larger chunks
max_parallel = 4           # agents running at the same time

# One entry per selector choice. ESTIMATE figures are replaced after the measured run
# (research.md R5, R13); `estimate = false` then drops the "estimate" word on the button.
[chunked.agents.haiku]
name = "claude-haiku-5-5"
label = "Haiku 5.5"
effort = "medium"
max_tokens = 16000
fallbacks = false                   # not offered for Haiku
orchestrator = "sonnet"
deadline_s = 180                    # the whole pass
max_cost_usd = 1.0                  # the whole map; chunks not started yet are skipped past it
expected_seconds_per_chunk = 30     # ESTIMATE
expected_cost_per_chunk_usd = 0.005 # ESTIMATE
estimate = true

[chunked.agents.sonnet]
name = "claude-sonnet-5-5"
label = "Sonnet 5.5"
effort = "medium"
max_tokens = 16000
fallbacks = true
orchestrator = "sonnet"
deadline_s = 180
max_cost_usd = 2.5
expected_seconds_per_chunk = 25     # ESTIMATE
expected_cost_per_chunk_usd = 0.06  # ESTIMATE
estimate = true

[chunked.agents.opus]
name = "claude-opus-5-5"
label = "Opus 5.5"
effort = "medium"
max_tokens = 16000
fallbacks = true
orchestrator = "opus"
deadline_s = 420
max_cost_usd = 6.0
expected_seconds_per_chunk = 60     # ESTIMATE
expected_cost_per_chunk_usd = 0.20  # ESTIMATE
estimate = true

[chunked.limits]                    # per chunk agent; the single session's [limits] are unchanged
max_turns = 16
max_views = 8
max_submissions = 2
max_cost_usd = 0.75

[chunked.review]                    # the orchestrator's seam review
strip_squares = 1.0                 # it may change lines within this distance of a seam
max_turns = 10
max_views = 6
max_submissions = 2
max_cost_usd = 0.75
expected_seconds = { sonnet = 20, opus = 45 }        # ESTIMATE, by orchestrator
expected_cost_usd = { sonnet = 0.05, opus = 0.15 }   # ESTIMATE, by orchestrator

[chunked.merge]
join_tolerance_squares = 0.3        # wall ends on a seam closer than this are joined
min_piece_squares = 0.05            # clipped wall pieces shorter than this are dropped
