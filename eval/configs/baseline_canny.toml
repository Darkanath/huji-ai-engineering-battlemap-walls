# Canny baseline (run R0, eval/baseline_canny.py). [params] are what the baseline uses;
# `python -m eval.baseline_canny` overwrites them with the best values from [grid]
# on the validation split and records the run in [tuned]. Frozen once tuned.

[params]
blur = 7
canny_low = 20
canny_high = 40
close = 5
min_length = 6.0
wall_width = 0.25

[grid]  # tuning grid; canny_high = canny_low x high_ratio
blur = [1, 3, 5, 7, 9, 11, 15]
canny_low = [10, 15, 20, 30, 50, 80, 120, 160]
high_ratio = [2, 3]
close = [1, 3, 5, 7, 9]
min_length = [0.5, 1.0, 2.0, 4.0, 6.0, 8.0, 12.0]

[tuned]
on = "val of dungeondraft, dungeon_alchemist: dd03_a, dd03_b, dd03_c, dd03_d"
boundary_f1_wall = 0.8451
date = "2026-10-21"
